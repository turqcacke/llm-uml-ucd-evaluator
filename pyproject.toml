[project]
name = "llm-uml-evaluator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dishka>=1.10.1",
    "langchain[openai]>=1.4.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff]
line-length = 79

[tool.ty.src]
include = ["src", "tests"]
exclude = ["exercises", "graphify-out"]

[project]
name = "llm-uml-evaluator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dishka>=1.10.1",
    "fastapi>=0.141.1",
    "graphviz>=0.21",
    "langchain-openrouter>=0.2.8",
    "langchain[openai]>=1.4.0",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.1",
    "pytest>=9.1.1",
    "tenacity>=9.1.4,<10",
    "tqdm>=4.67,<5",
    "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = ["testcontainers>=4.15,<5"]
eval = [
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff]
line-length = 79

[tool.ty.src]
include = ["src", "tests"]
exclude = ["graphify-out"]

services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval '
          try {
            if (db.hello().isWritablePrimary) { quit(0) }
            rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})
          } catch (_) {}
          quit(1)'
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mongodb-data:
